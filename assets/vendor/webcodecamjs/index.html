<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>WebCodeCamJS</title>
        <link href="css/bootstrap.min.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body onload="play_onload();">
                <div class="panel-body text-center">
                    <div class="col-md-6">
                        <div class="row panel-heading">
                            <select class="form-control" id="camera-select"></select>
                            <button title="Play" class="btn btn-success btn-sm" id="play" name="play" type="button" data-toggle="tooltip"><span class="glyphicon glyphicon-play"></span></button>
                        </div>
                        <div class="row">
                            <div class="well" style="position: relative;display: inline-block;">
                                <canvas width="320" height="240" id="webcodecam-canvas"></canvas>
                                <div class="scanner-laser laser-rightBottom" style="opacity: 0.5;"></div>
                                <div class="scanner-laser laser-rightTop" style="opacity: 0.5;"></div>
                                <div class="scanner-laser laser-leftBottom" style="opacity: 0.5;"></div>
                                <div class="scanner-laser laser-leftTop" style="opacity: 0.5;"></div>
                            </div>
                        </div>
                    </div>
                </div>


        <script type="text/javascript" src="js/filereader.js"></script>
        <script type="text/javascript" src="js/qrcodelib.js"></script>
        <script type="text/javascript" src="js/webcodecamjs.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
        <script type="text/javascript">
            function play_onload(){
                //$("#play").click();
                document.getElementById("play").click();
            }
        </script> 
    </body>
</html>
